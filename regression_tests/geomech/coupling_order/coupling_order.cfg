[suites]
standard = structured_internal_coupling_order_0 structured_internal_coupling_order_1 structured_internal_coupling_order_0_biot1 structured_internal_coupling_order_1_biot1
geomechanics = structured_internal_coupling_order_0 structured_internal_coupling_order_1 structured_internal_coupling_order_0_biot1 structured_internal_coupling_order_1_biot1 structured_internal_coupling_order_1_unstructured_guard structured_internal_biot0_pressure_offset structured_internal_biot1_pressure_offset

[default-test-criteria]
time = 50 percent
displacement = 1.0e-8 absolute
strain = 1.0e-8 absolute
stress = 1.0e-8 relative

[structured_internal_coupling_order_1]
skip_check_gold = true
skip_check_regression = true
timeout = 120

[structured_internal_coupling_order_0]
skip_check_gold = true
skip_check_regression = true
timeout = 120

[structured_internal_coupling_order_1_biot1]
skip_check_gold = true
skip_check_regression = true
timeout = 120

[structured_internal_coupling_order_0_biot1]
skip_check_gold = true
skip_check_regression = true
timeout = 120

[structured_internal_coupling_order_1_unstructured_guard]
planned_error = true
input_arguments = -pflotranin structured_internal_coupling_order_1_unstructured_guard.in
timeout = 120

[structured_internal_biot1_pressure_offset]
skip_check_gold = true
timeout = 120

[structured_internal_biot0_pressure_offset]
skip_check_gold = true
timeout = 120
